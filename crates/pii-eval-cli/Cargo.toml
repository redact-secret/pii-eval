[package]
name = "pii-eval-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "pii-eval internal crate (CLI); not a consumer contract."

[lints]
workspace = true

[features]
# TEST ONLY (docs/worker-job.md): compiles the worker test adapters, the only way
# to run a worker job end to end. OFF by default and never enabled by the engine
# artifact build; CI fails the build if the release binary contains the marker.
worker-test-adapters = []

[dependencies]
pii-eval-contracts.workspace = true
pii-eval-kernel.workspace = true
pii-eval-adapters.workspace = true
# Strict JSON values for the run configuration, job context and summaries (already
# reviewed for contracts, docs/dependency-policy.md). Without `preserve_order`
# objects are ordered maps, so summaries have a deterministic key order.
serde_json.workspace = true
# The `Serialize` bound of the summary helpers (no derive in this crate).
serde.workspace = true

# Unix only: SIGINT/SIGTERM flag handlers (P8, ADR 0010). Windows execution is refused.
[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[dev-dependencies]
# Test-only: lets the smoke test reach every crate boundary. Compat stays
# removable; deleting it also deletes this line and the one smoke assertion.
pii-eval-compat.workspace = true

[[bin]]
name = "pii-eval"
path = "src/main.rs"

# The pii-evidence snapshot consumer (ADR 0019): verify, import, plan. A separate
# binary so the five-command contract of `pii-eval` (docs/cli.md) is unchanged.
[[bin]]
name = "pii-eval-evidence"
path = "src/evidence_main.rs"

# TEST ONLY (docs/worker-job.md, "real sandbox end to end"): the engine the custodian's
# bubblewrap replica runs as `/stage/engine --job /job/job.json`, with the worker test
# adapters. It needs the feature, so it is never built by `cargo build`, by `cargo test`
# without the feature, or by the engine artifact build.
[[example]]
name = "worker_test_engine"
required-features = ["worker-test-adapters"]
