name: evaluate

# Runs a PUBLIC / SYNTHETIC pii-eval evaluation with a PREBUILT engine artifact
# (docs/ci-artifacts.md). It never rebuilds an engine that already exists:
#
#   - `engine-run-id` set: use the engine artifact of that workflow run, if
#     GitHub's own record of the run says it is acceptable (tools/ci/resolve-engine.mjs:
#     a successful push or dispatch on main of this repository, from one of this
#     repository's build workflows, artifact named after the run's head commit);
#   - `engine-run-id` empty: build the engine once through build-engine.yml in
#     THIS run and use that artifact.
#
# It can be started by hand, by `gh workflow run evaluate.yml -f ...` or the
# workflow-dispatch API from another workflow or tool with `actions: write` on
# this repository, or called from a workflow in this repository with `uses:`.
# Protected runs are not possible here: the CLI refuses a protected run without
# a custodian job context and this workflow supplies none.

on:
  workflow_dispatch:
    inputs:
      engine-run-id:
        description: Workflow run id whose engine artifact to use (empty = build one in this run)
        required: false
        type: string
        default: ""
      config:
        description: Run configuration path inside the checkout
        required: false
        type: string
        default: examples/quickstart/run-config.json
      allow-unverified-ref:
        description: Accept an engine from a pull request or another branch (an UNREVIEWED binary runs here; only for deliberate tests)
        required: false
        type: boolean
        default: false
      artifact-suffix:
        description: Optional lowercase suffix for the output artifact name (so two calls in one run do not collide)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      engine-run-id:
        description: Workflow run id whose engine artifact to use (empty = build one in this run)
        required: false
        type: string
        default: ""
      config:
        description: Run configuration path inside the checkout
        required: false
        type: string
        default: examples/quickstart/run-config.json
      allow-unverified-ref:
        description: Accept an engine from a pull request or another branch (an UNREVIEWED binary runs here; only for deliberate tests)
        required: false
        type: boolean
        default: false
      artifact-suffix:
        description: Optional lowercase suffix for the output artifact name (so two calls in one run do not collide)
        required: false
        type: string
        default: ""
    outputs:
      artifact-name:
        description: Name of the artifact holding the run output
        value: ${{ jobs.evaluate.outputs.artifact-name }}

# `actions: read` lets the job read the run record and the artifact of a run of
# this repository. Nothing else is needed; there are no secrets.
permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build the engine (only when no run id was given)
    if: ${{ inputs.engine-run-id == '' }}
    uses: ./.github/workflows/build-engine.yml

  evaluate:
    name: evaluate with the engine artifact
    needs: build
    # Run when the build job succeeded or was skipped (a run id was given).
    if: ${{ !cancelled() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-name: pii-eval-run-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.artifact-suffix != '' && format('-{0}', inputs.artifact-suffix) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node runs the shim of the example scanner and tools/ci.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Inputs are untrusted text: they reach shell only through env, and are
      # checked here (single line, exact shapes) before anything uses them.
      - name: Check the inputs
        id: inputs
        shell: bash
        env:
          ENGINE_RUN_ID: ${{ inputs.engine-run-id }}
          CONFIG: ${{ inputs.config }}
          SUFFIX: ${{ inputs.artifact-suffix }}
        run: |
          set -euo pipefail
          nl=$'\n'
          if [[ ! "$SUFFIX" =~ ^[a-z0-9-]{0,40}$ ]]; then
            echo "artifact-suffix must be at most 40 characters of a-z, 0-9 and -" >&2
            exit 2
          fi
          if [[ "$ENGINE_RUN_ID" == *"$nl"* || "$CONFIG" == *"$nl"* ]]; then
            echo "inputs must be a single line" >&2
            exit 2
          fi
          if [[ -n "$ENGINE_RUN_ID" && ! "$ENGINE_RUN_ID" =~ ^[0-9]{1,20}$ ]]; then
            echo "engine-run-id must be a workflow run id (digits)" >&2
            exit 2
          fi
          if [[ ! "$CONFIG" =~ ^[A-Za-z0-9._/-]{1,200}$ || "$CONFIG" == -* || "$CONFIG" == /* || "$CONFIG" == *..* ]]; then
            echo "config must be a plain relative path inside the checkout" >&2
            exit 2
          fi
          if [[ ! -f "$CONFIG" || -L "$CONFIG" ]]; then
            echo "config must be a regular file in the checkout" >&2
            exit 2
          fi
          case "$(realpath "$CONFIG")" in
            "$PWD"/*) ;;
            *) echo "config escapes the checkout" >&2; exit 2 ;;
          esac
          echo "run-id=${ENGINE_RUN_ID:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      # Decide from GitHub's own record of the run, not from the artifact's contents.
      - name: Choose the engine artifact
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.inputs.outputs.run-id }}
          ALLOW_UNVERIFIED: ${{ inputs.allow-unverified-ref }}
        run: |
          set -euo pipefail
          node tools/ci/resolve-engine.mjs \
            --run-id "$RUN_ID" \
            --current-run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --allow-unverified-ref "${ALLOW_UNVERIFIED:-false}" \
            --github-output "$GITHUB_OUTPUT" | tee "$RUNNER_TEMP/engine-resolved.json"
      # Exactly one artifact, by exact name: it is extracted directly into `path`.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.resolve.outputs.artifact-name }}
          path: ${{ runner.temp }}/engine-download
          run-id: ${{ steps.inputs.outputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify the engine artifact
        shell: bash
        env:
          COMMIT: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          node tools/ci/verify-engine.mjs \
            --dir "$RUNNER_TEMP/engine-download" \
            --repository "$GITHUB_REPOSITORY" \
            --target linux-x86_64 \
            --commit "$COMMIT" \
            --make-executable > "$RUNNER_TEMP/engine-verified.json"
          grep -q '"ok":true' "$RUNNER_TEMP/engine-verified.json"
          cat "$RUNNER_TEMP/engine-verified.json"
          if [ "$COMMIT" != "$GITHUB_SHA" ]; then
            echo "::notice::the engine commit differs from the commit of the inputs checked out here; both are recorded in the summary"
          fi
      # The engine is a program from an artifact: while it runs, workflow commands
      # are switched off, its output goes to files, and only a re-serialized JSON
      # line and a prefixed stderr excerpt are printed afterwards.
      - name: Run the evaluation (public, synthetic)
        shell: bash
        env:
          CONFIG: ${{ inputs.config }}
          PII_EVAL_REQUIRE_NODE: "1"
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/engine-download/pii-eval"
          out="$RUNNER_TEMP/run-output"
          mkdir -p "$out"
          # Not a sandbox: the engine is a program of this repository's own build and
          # runs as the runner user. What this does: workflow commands are off while
          # it runs, it cannot write the runner's command files (GITHUB_ENV, GITHUB_PATH,
          # GITHUB_OUTPUT, GITHUB_STATE, GITHUB_STEP_SUMMARY: they are unset for it),
          # one file may not exceed 512 MiB, it has 20 minutes, and its stderr is
          # printed as printable ASCII only (a lone carriage return or an escape
          # sequence cannot start a workflow command).
          untrusted() {
            local o="$1" e="$2" token rc=0
            shift 2
            token=$(node -e 'process.stdout.write(require("crypto").randomBytes(16).toString("hex"))')
            echo "::stop-commands::$token"
            (
              ulimit -f 524288
              exec timeout 1200 env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE -u GITHUB_STEP_SUMMARY "$@"
            ) > "$o" 2> "$e" || rc=$?
            echo "::$token::"
            head -c 2000 "$e" | LC_ALL=C tr -c '\040-\176\n' '?' | sed 's/^/stderr| /'
            return "$rc"
          }
          rc=0
          untrusted "$RUNNER_TEMP/run-summary.raw" "$RUNNER_TEMP/run-stderr.raw" \
            "$engine" run --config "$CONFIG" --node "$(command -v node)" --out "$out/run" || rc=$?
          node tools/ci/summary-line.mjs "$RUNNER_TEMP/run-summary.raw" | tee "$RUNNER_TEMP/run-summary.json"
          if [ "$rc" -ne 0 ]; then
            echo "pii-eval run exited with status $rc" >&2
            exit "$rc"
          fi
          snapshot=$(node -e 'const p=require("path"),fs=require("fs");const c=JSON.parse(fs.readFileSync(process.env.CONFIG,"utf8"));process.stdout.write(p.resolve(p.dirname(process.env.CONFIG),c.snapshot.path))')
          rc=0
          untrusted "$RUNNER_TEMP/validate-summary.raw" "$RUNNER_TEMP/validate-stderr.raw" \
            "$engine" validate "$out/run/run-artifact.json" --snapshot "$snapshot" --manifest "$out/run/manifest.json" || rc=$?
          node tools/ci/summary-line.mjs "$RUNNER_TEMP/validate-summary.raw" | tee "$RUNNER_TEMP/validate-summary.json"
          if [ "$rc" -ne 0 ]; then
            echo "pii-eval validate exited with status $rc" >&2
            exit "$rc"
          fi
          # The public artifact too: schema 1.1, or 1.2 with the product projection, which
          # is then recomputed from the snapshot and the configuration's roster
          # (docs/cli.md, ADR 0016). The roster path comes from the configuration, resolved
          # like the snapshot path; none means no projection was asked for.
          roster=$(node -e 'const p=require("path"),fs=require("fs");const c=JSON.parse(fs.readFileSync(process.env.CONFIG,"utf8"));const r=c.projection&&c.projection.roster&&c.projection.roster.path;process.stdout.write(r?p.resolve(p.dirname(process.env.CONFIG),r):"")')
          roster_args=()
          if [ -n "$roster" ]; then
            roster_args=(--projection-roster "$roster")
          fi
          rc=0
          untrusted "$RUNNER_TEMP/validate-public-summary.raw" "$RUNNER_TEMP/validate-public-stderr.raw" \
            "$engine" validate "$out/run/public-synthetic-artifact.json" --snapshot "$snapshot" "${roster_args[@]}" || rc=$?
          node tools/ci/summary-line.mjs "$RUNNER_TEMP/validate-public-summary.raw" | tee "$RUNNER_TEMP/validate-public-summary.json"
          if [ "$rc" -ne 0 ]; then
            echo "pii-eval validate (public artifact) exited with status $rc" >&2
            exit "$rc"
          fi
      - name: Summary
        shell: bash
        run: |
          {
            echo "### pii-eval evaluation"
            echo
            echo "Engine chosen from GitHub's record of the run:"
            echo '```json'
            cat "$RUNNER_TEMP/engine-resolved.json"
            echo '```'
            echo "Engine verified before use:"
            echo '```json'
            cat "$RUNNER_TEMP/engine-verified.json"
            echo '```'
            echo "Run summary (re-serialized, fixed vocabulary, no input text):"
            echo '```json'
            cat "$RUNNER_TEMP/run-summary.json"
            echo '```'
            echo "Validation summary:"
            echo '```json'
            cat "$RUNNER_TEMP/validate-summary.json"
            echo '```'
            echo "Public artifact validation summary (the product projection, when asked for, is recomputed):"
            echo '```json'
            cat "$RUNNER_TEMP/validate-public-summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pii-eval-run-${{ github.run_id }}-${{ github.run_attempt }}${{ inputs.artifact-suffix != '' && format('-{0}', inputs.artifact-suffix) || '' }}
          path: ${{ runner.temp }}/run-output
          retention-days: 14
          if-no-files-found: error
