name: build-engine

# Builds the pii-eval engine ONCE and publishes it as an internal workflow
# artifact (docs/ci-artifacts.md), the way credential-eval shares its engine.
# Other workflows download and verify that artifact instead of rebuilding:
# `evaluate.yml`, or any workflow that calls this one with `uses:`.
#
# Internal only. This is not a release: no tag, no GitHub Release, no public
# download, 30-day retention on main (3 days elsewhere), readable by people with
# read access to this repository. The artifact is neither signed nor attested.

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artifact (pii-eval-engine-<commit>-linux-x86_64)
        value: ${{ jobs.build.outputs.artifact-name }}
      binary-sha256:
        description: SHA-256 of the built pii-eval binary
        value: ${{ jobs.build.outputs.binary-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build and publish the engine (linux-x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-name: pii-eval-engine-${{ github.sha }}-linux-x86_64
      binary-sha256: ${{ steps.sums.outputs.binary-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node runs tools/ci (build information and verification), standard library only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Same cache action credential-eval uses, pinned by SHA. Only the registry
      # and git dependencies are cached, not the target directory: the published
      # binary is compiled from a clean target directory, not from cached
      # incremental output.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
      # Exactly the command documented in docs/cli.md (the whole workspace, so the
      # release profile of every crate is also exercised).
      - name: Build (release, locked)
        run: cargo build --release --locked
      # The engine artifact must not contain the worker test adapters (feature
      # `worker-test-adapters`, docs/worker-job.md): they would let a binary run
      # a protected-looking job without the custodian's decided contract. The
      # positive control proves the search can find the marker.
      - name: The release binary contains no worker test adapters
        run: |
          marker='pii-eval-worker-test-adapters'
          printf 'control %s\n' "$marker" > "$RUNNER_TEMP/marker-control"
          grep -aq -- "$marker" "$RUNNER_TEMP/marker-control"
          if grep -aq -- "$marker" target/release/pii-eval; then
            echo "the release binary contains the worker test adapters" >&2
            exit 1
          fi
      # GITHUB_SHA is the merge commit for a pull request (it disappears after the
      # merge); HEAD_SHA is the commit the event is about. Both are recorded.
      - name: Assemble the artifact directory
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/engine"
          cp target/release/pii-eval "$RUNNER_TEMP/engine/pii-eval"
          chmod +x "$RUNNER_TEMP/engine/pii-eval"
          node tools/ci/build-info.mjs \
            --dir "$RUNNER_TEMP/engine" \
            --target linux-x86_64 \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --head-sha "$HEAD_SHA" \
            --event "$EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      # The same check every consumer runs, before anything is uploaded.
      - name: Verify what will be uploaded
        run: |
          node tools/ci/verify-engine.mjs \
            --dir "$RUNNER_TEMP/engine" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --target linux-x86_64 \
            --make-executable
      - name: Read the binary digest
        id: sums
        run: echo "binary-sha256=$(awk '$2 == "pii-eval" { print $1 }' "$RUNNER_TEMP/engine/SHA256SUMS")" >> "$GITHUB_OUTPUT"
      - name: Summary
        run: |
          {
            echo "### pii-eval engine artifact"
            echo
            echo "- artifact: \`pii-eval-engine-${GITHUB_SHA}-linux-x86_64\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- binary sha256: \`$(awk '$2 == "pii-eval" { print $1 }' "$RUNNER_TEMP/engine/SHA256SUMS")\`"
            echo "- internal artifact (30 days on main, 3 elsewhere); not a release (docs/ci-artifacts.md)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pii-eval-engine-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/engine
          # Re-running all jobs of a run uploads the same name again.
          overwrite: true
          # 30 days for main; a pull request's or another branch's binary is not
          # worth keeping that long.
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 3 }}
          if-no-files-found: error
