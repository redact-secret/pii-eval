name: ci

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used or required. Network use is limited to the Rust
# toolchain distribution and crates.io. No benchmark checkout, no protected
# corpus, no scanner binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, locked tests (pinned toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml selects the pinned toolchain; rustup installs it on first use.
      - name: Toolchain identity
        run: rustc --version --verbose
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (includes dependency-policy guard and smoke test)
        run: cargo test --workspace --locked

  msrv:
    name: tests on declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test on MSRV
        run: cargo +1.85.0 test --workspace --locked
