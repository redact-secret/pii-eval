name: ci

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used or required. Network use is limited to the Rust
# toolchain distribution and crates.io. No benchmark checkout, no protected
# corpus, no scanner binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, locked tests (pinned toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22 runs the inert fake scanner shims of the adapter tests. No
      # scanner package is installed and no npm command runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # rust-toolchain.toml selects the pinned toolchain; rustup installs it on first use.
      - name: Toolchain identity
        run: rustc --version --verbose && node --version
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (includes dependency-policy guard, smoke test, goldens)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test --workspace --locked
      # Also part of the run above; separate so a conformance, property or
      # legacy-difference failure is named.
      - name: Range, matching, accounting and statistics conformance, properties, oracle compatibility
        run: cargo test -p pii-eval-kernel -p pii-eval-compat --locked
      # Also part of the run above; separate so a method, variant-id, seed or
      # oracle-compatibility failure is named (ADR 0007).
      - name: Methods (variant provenance, independent id/seed vectors, oracle compatibility, conservation)
        run: cargo test -p pii-eval-kernel --locked --test methods --test methods_ids --test methods_oracle --test methods_accounting
      # Also part of the run above; separate so a drift failure is named.
      - name: Schema drift (generated must equal committed)
        run: cargo test -p pii-eval-contracts --locked --test schema_drift
      # Also part of the run above; separate so an adapter failure is named.
      # Real-scanner tests are opt-in and skipped here with a printed reason.
      - name: Adapters (fake shims, pins, failure states, environment, injection)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-adapters --locked
      # Also part of the run above; separate so an execution, determinism,
      # process-tree or atomic-write failure is named (P7). Needs Node and `ps`.
      - name: Executor (bounded execution, determinism, process trees, atomic writes, revision-2 goldens)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-cli --locked --test executor --test process_executor --test writer --test golden_rev2
      # Also part of the run above; separate so a CLI failure is named (P8,
      # docs/cli.md): every command, invalid configs, provenance mismatches,
      # output handling, exit codes, cancellation by signal with real processes,
      # the documented offline quickstart. Needs Node and `ps`.
      - name: CLI (run, replay, validate, compare, signals, exit codes, documented quickstart)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-cli --locked --test smoke --test cli_commands --test cli_replay --test cli_gate --test cli_review --test cli_run --test cli_cancel --test cli_docs --test cli_example
      # Execution is refused on Windows, but the crate must keep compiling there.
      - name: Windows compile check
        run: rustup target add x86_64-pc-windows-msvc && cargo check --workspace --locked --target x86_64-pc-windows-msvc
      # The release build command documented in docs/cli.md, and the binary's identity.
      - name: Release build (documented command)
        run: cargo build --release --locked && target/release/pii-eval --version

  msrv:
    name: tests on declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Test on MSRV
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo +1.85.0 test --workspace --locked
