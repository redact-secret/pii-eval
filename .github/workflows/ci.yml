name: ci

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used or required. Network use is limited to the Rust
# toolchain distribution, crates.io and the Actions cache and artifact services.
# No benchmark checkout, no protected corpus, no scanner binaries.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: fmt, clippy, locked tests (pinned toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 22 runs the inert fake scanner shims of the adapter tests. No
      # scanner package is installed and no npm command runs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # rust-toolchain.toml selects the pinned toolchain; rustup installs it on first use.
      - name: Toolchain identity
        run: rustc --version --verbose && node --version
      # Same cache action credential-eval uses, pinned by SHA; keyed by the
      # lockfile and the toolchain.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (includes dependency-policy guard, smoke test, goldens)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test --workspace --locked
      # Also part of the run above; separate so a conformance, property or
      # legacy-difference failure is named.
      - name: Range, matching, accounting and statistics conformance, properties, oracle compatibility
        run: cargo test -p pii-eval-kernel -p pii-eval-compat --locked
      # Also part of the run above; separate so a method, variant-id, seed or
      # oracle-compatibility failure is named (ADR 0007).
      - name: Methods (variant provenance, independent id/seed vectors, oracle compatibility, conservation)
        run: cargo test -p pii-eval-kernel --locked --test methods --test methods_ids --test methods_oracle --test methods_accounting
      # Also part of the run above; separate so a drift failure is named.
      - name: Schema drift (generated must equal committed)
        run: cargo test -p pii-eval-contracts --locked --test schema_drift
      # Also part of the run above; separate so an adapter failure is named.
      # Real-scanner tests are opt-in and skipped here with a printed reason.
      - name: Adapters (fake shims, pins, failure states, environment, injection)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-adapters --locked
      # Also part of the run above; separate so an execution, determinism,
      # process-tree or atomic-write failure is named (P7). Needs Node and `ps`.
      - name: Executor (bounded execution, determinism, process trees, atomic writes, revision-2 goldens)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-cli --locked --test executor --test process_executor --test writer --test golden_rev2
      # Also part of the run above; separate so a CLI failure is named (P8,
      # docs/cli.md): every command, invalid configs, provenance mismatches,
      # output handling, exit codes, cancellation by signal with real processes,
      # the documented offline quickstart. Needs Node and `ps`.
      - name: CLI (run, replay, validate, compare, signals, exit codes, documented quickstart)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-cli --locked --test smoke --test cli_commands --test cli_replay --test cli_gate --test cli_review --test cli_run --test cli_cancel --test cli_docs --test cli_example
      # Also part of the run above; separate so an App-core failure is named (P11,
      # docs/github-app.md): forged/replayed/unauthorized/cross-repository/stale
      # requests, bounds, retries, sanitized Checks, and one real run through the
      # CLI library. No network, no secret; needs Node and `ps` for the last test.
      - name: GitHub App core (webhook security, job flow, sanitized Checks, parser properties, CLI-library run)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-app --locked
      # The CLI must stay usable with no App: nothing depends on the app crate.
      - name: CLI independence from the App (dependency guard)
        run: cargo test -p pii-eval-cli --locked --test dependency_policy
      # Also part of the run above; separate so a parity failure is named (P9, ADR 0012): the engine
      # against the COMMITTED export of the pinned oracle's own output (no oracle or registry access),
      # the classification census, negative tests, invariance, the engine end to end and the committed
      # real-scanner observation. The live real-scanner check is opt-in and skipped with a reason here.
      - name: Oracle parity (committed export, classified differences, negative tests, invariance, engine end to end)
        run: cargo test -p pii-eval-cli --locked --test oracle_parity --test oracle_parity_cli --test oracle_parity_docs --test real_scanner
      # The oracle tooling is manual and never runs here; only its syntax is checked.
      - name: Oracle parity tooling syntax
        run: |
          for f in tools/oracle-parity/*.mjs tools/oracle-parity/real-scanner/*.mjs tools/oracle-parity/stubs/*.mjs; do node --check "$f"; done
          bash -n tools/oracle-parity/regenerate.sh
          bash -n tools/oracle-parity/real-scanner/run.sh
      # Consumer example (P12, ADR 0014): standard library only, no install step,
      # no network. Runs against committed fixtures produced by the real engine.
      - name: Consumer example (exact pins, stale and wrong artifacts, no pooling, no decisions)
        run: node --test examples/consumer/test/consume.test.mjs
      # Also part of the full run; separate so a boundary failure is named (P12):
      # fixtures regenerated by the engine must equal the committed ones, the
      # synthetic custodian round trip (a stub; no custodian code), the
      # public-release tripwire and the handoff/example documentation checks.
      - name: Custodian boundary (engine-made fixtures, synthetic round trip, release hygiene, handoff docs)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-cli --locked --test consumer_fixtures --test custodian_round_trip --test public_release_hygiene --test consumer_handoff_docs
      # Also part of the run above; separate so a performance-harness failure is named (P10, ADR 0013):
      # the harness at tiny sizes, work-counter guards (scan calls, sessions, concurrency bounds, rows),
      # semantic equality of the executor, replay and every host worker cap, and CLI replay equality.
      # No wall-time assertion exists anywhere. Needs Node and `ps`.
      - name: Performance harness (tiny sizes, deterministic work-counter and equality guards)
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo test -p pii-eval-cli --locked --test perf_harness
      # The measurement suites are manual (they need the oracle through `gh`); only the tooling's pure parts run here.
      - name: Performance tooling (generator determinism, report parsers) and syntax
        run: |
          node --test tools/perf/test/perf-tools.test.mjs
          for f in tools/perf/*.mjs tools/perf/suites/*.mjs; do node --check "$f"; done
      # Execution is refused on Windows, but the crate must keep compiling there.
      - name: Windows compile check
        run: rustup target add x86_64-pc-windows-msvc && cargo check --workspace --locked --target x86_64-pc-windows-msvc
      # Internal build artifacts (docs/ci-artifacts.md): build information and
      # artifact verification, and the workflow policy (SHA-pinned actions,
      # explicit permissions, no untrusted expression inside a script).
      - name: CI tooling (build information, engine artifact verification) and workflow policy
        run: |
          node --test tools/ci/test/ci-tools.test.mjs tools/ci/test/workflow-policy.test.mjs tools/isolation/test/argv.test.mjs tools/isolation/test/lib.test.mjs
          for f in tools/ci/*.mjs tools/isolation/*.mjs; do node --check "$f"; done
          node tools/ci/workflow-policy.mjs .github/workflows/*.yml

  msrv:
    name: tests on declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Keep in sync with workspace.package.rust-version in Cargo.toml.
      - name: Install MSRV toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-1.85
      - name: Test on MSRV
        env:
          PII_EVAL_REQUIRE_NODE: "1"
        run: cargo +1.85.0 test --workspace --locked

  # The engine artifact (docs/ci-artifacts.md): the documented release build,
  # published once as an internal workflow artifact that evaluate.yml and any
  # other dispatched workflow download instead of rebuilding.
  engine:
    name: engine artifact
    uses: ./.github/workflows/build-engine.yml

  # evaluate.yml end to end on every run: it downloads the engine artifact the
  # `engine` job just published (same run id), verifies it and runs the
  # documented synthetic quickstart. No second build. Proves the dispatchable
  # workflow keeps working, since a workflow_dispatch workflow cannot be started
  # from a branch before it exists on the default branch.
  evaluate:
    name: evaluate with the engine artifact
    needs: engine
    uses: ./.github/workflows/evaluate.yml
    permissions:
      contents: read
      actions: read
    with:
      engine-run-id: ${{ format('{0}', github.run_id) }}

  # Real Linux bubblewrap measurement of Node and the engine under the custodian's
  # worker limits (docs/custodian-isolation-node.md): a replica of the custodian's
  # launcher on a hosted runner, synthetic data, the controls must pass, no limit is
  # ever loosened. Uses the engine artifact published above (same run id).
  isolation:
    name: node and the engine under the custodian sandbox limits
    needs: engine
    uses: ./.github/workflows/isolation.yml
    permissions:
      contents: read
      actions: read
    with:
      engine-run-id: ${{ format('{0}', github.run_id) }}
