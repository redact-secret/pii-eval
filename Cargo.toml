[workspace]
resolver = "3"
members = [
    "crates/pii-eval-contracts",
    "crates/pii-eval-kernel",
    "crates/pii-eval-adapters",
    "crates/pii-eval-cli",
    "crates/pii-eval-compat",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Verified minimum, not inherited from another repository. See docs/dependency-policy.md.
rust-version = "1.85"
publish = false

[workspace.dependencies]
pii-eval-contracts = { path = "crates/pii-eval-contracts" }
pii-eval-kernel = { path = "crates/pii-eval-kernel" }
pii-eval-adapters = { path = "crates/pii-eval-adapters" }
pii-eval-compat = { path = "crates/pii-eval-compat" }
# Reviewed third-party crates (docs/dependency-policy.md). Exact pins: they
# determine serialization, schema output and digests.
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
schemars = { version = "=1.2.2", default-features = false, features = ["derive", "std"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
# Process-group signalling, `killpg` and a group-liveness probe (adapters only; P7, ADR 0009).
# Safe wrappers over syscalls std does not expose; first-party crates stay
# `forbid(unsafe_code)`. Exact pin, process feature only.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
# Signal handlers for the CLI (P8, ADR 0010): flag-setting handlers for SIGINT and
# SIGTERM so a signal cancels the run and the scanner trees are cleaned up.
# `std` has no signal API and first-party crates forbid `unsafe`. CLI crate only,
# Unix only, no default features (no channel/iterator machinery).
signal-hook = { version = "=0.4.4", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Overflow checks stay on: counters are checked integers by convention.
overflow-checks = true
