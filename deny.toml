# cargo-deny policy (local/optional; not yet a CI gate). See docs/dependency-policy.md.
# Offline checks: `cargo deny --locked check bans licenses sources`.
# `advisories` needs the RustSec database over the network and is therefore
# not part of the default CI network allowance.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Unpublished workspace path dependencies carry no version requirement.
allow-wildcard-paths = true
# Process and network crates must not enter the dependency graph without a
# reviewed policy change. Kernel/contracts isolation is enforced separately by
# crates/pii-eval-cli/tests/dependency_policy.rs.
deny = [
    { crate = "tokio" },
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "ureq" },
    { crate = "openssl" },
    { crate = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
# Workspace crates are unpublished (`publish = false`) and licensed MIT (LICENSE,
# README: Publication and licensing); they are ignored here, and MIT is allowed
# for dependencies as well.
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.93
